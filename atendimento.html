ca</option><option>Devolução</option><option>Reembolso</option><option>Produto com defeito</option><option>Produto incorreto</option><option>Outro</option></select></label></div><label class="field">Conte o que aconteceu<textarea name="comment" rows="5" maxlength="2000" placeholder="Descreva o motivo e como podemos ajudar..." required></textarea></label><label class="field">Fotos (até 3)<input id="support-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><small class="field-help">JPG, PNG ou WEBP. Máximo de 3 imagens, até 900 KB cada.</small></label><div id="photo-preview" class="photo-preview"></div><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="privacy-check"><input type="checkbox" name="privacy" required> Confirmo que os dados informados se referem à minha compra e autorizo o uso para tratar esta solicitação.</label><p class="form-note" id="support-feedback" role="status" aria-live="polite"></p><button class="button button-primary" type="submit">Enviar solicitação ↗</button></form></main><footer class="site-footer checkout-footer"><a class="brand" href="index.html">KRYPTO<span class="brand-dot">.</span></a><p>ATENDIMENTO COM RESPEITO.</p><small>© 2026 KRYPTO.</small></footer><script src="customer-services.js" defer></script></body></html>
